# Catalog of every SKILL.md in library/ (plus a few reference docs).
# `harness.py verify` fails if an entry points at a missing file and warns when
# the library holds a SKILL.md that is not listed here.
#
# id      <library key>/<skill folder>. The file is
#         library/<key>/<folder>/SKILL.md unless `path` (relative to
#         library/<key>/) overrides it.
# status  active    routable through registry/capabilities.yaml
#         chained   loaded by another library skill (`via`), never routed directly
#         excluded  kept in the library but never loaded (`reason` says why)
# kind    skill (default) | reference (a supporting doc, not a SKILL.md)
# requires
#   mcp      MCP providers that expose the tools this skill needs
#   env      environment variables the user must already have set
#   bins     executables that must be on PATH
#   python   true when bundled scripts need the library's python_deps
# notes   adaptation notes printed by `harness.py resolve` when the skill is selected

skills:

  # ---------------------------------------------------------------- newo (MCP)
  newo/blender-mcp:
    status: active
    summary: How to drive the primary MCP server - instance claim/release, structured node tools, safe verification.
    requires: {mcp: [newo-ether]}
    notes: >-
      Its "execute_blender_code is a fallback" rule governs node-graph work.
      Mesh, light, camera, render and animation work has no structured tool, so
      the cc recipes run through execute_blender_code as that skill's
      capability-gap case. Always release the Blender instance before the final reply.
      Its node layout reference was written for its author: "the user's" style rules
      there (short Chinese frame labels among them) are that author's. Label frames in
      the language of the person you are working for, and treat the layout rules as
      defaults. Never enable script auto-run for a downloaded or appended asset, and
      ask before relinking external files or baking, clearing or resetting a cache.
  newo/asset-workflows:
    status: active
    kind: reference
    path: blender-mcp/references/asset-workflows.md
    summary: Poly Haven, Sketchfab, Hyper3D and Hunyuan3D asset tools of the primary MCP.
    requires: {mcp: [newo-ether]}
    notes: >-
      Hyper3D and Hunyuan3D are paid services, and image-conditioned generation
      uploads the reference images to them. Use them only when the user asked for
      generation and the service is already configured in Blender's add-on panel;
      say which images will leave the machine before you start. Never ask for a key
      in chat.
  newo/render-workflows:
    status: active
    kind: reference
    path: blender-mcp/references/render-workflows.md
    summary: Render configuration and viewport verification through the primary MCP.
    requires: {mcp: [newo-ether]}

  # ------------------------------------------------------- cc: orchestration
  cc/text-to-blender:
    status: active
    summary: Execution conventions - fresh namespace per call, GEO-/MAT-/LGT- naming, world reset, dimension lookup, visual validation checkpoint.
    notes: >-
      The library's own orchestrator. Under the harness its routing table is advisory:
      the load plan decides which skills are read. Keep its code-execution
      rules, naming conventions and visual validation checkpoint.
  cc/blender-pro-workflow:
    status: active
    summary: Scene assembly order (block-out, camera, light, forms, materials, detail, render), critique protocol, recovery patterns.
  cc/blender-skill-harmonizer:
    status: active
    summary: Precedence, handoff artifacts and conflict rules when several skills share one job.
  cc/quality-refinement-autoloop:
    status: active
    summary: Diagnose a sub-par result, pick the failing dimension, repair, re-validate.
    notes: >-
      Adapted from the original, whose loop went on to patch skill files, bump
      versions and prepare commits; those phases were removed. Record the lesson
      in the job report and, in a clone, in notes/lessons.md.

  # ------------------------------------------------------ cc: core production
  cc/blender-modeling:
    status: active
    summary: Primitives, hard-surface modeling, modifier stacks, bmesh edits.
  cc/blender-materials:
    status: active
    summary: Principled BSDF PBR recipes - metal, glass, plastic, fabric, skin, procedural patterns.
  cc/blender-lighting:
    status: active
    summary: Three-point, HDRI, studio, cinematic and subject-class lighting profiles.
    notes: >-
      Its HDRI and studio recipes clear the World's nodes and remove lights named
      LGT-key, LGT-fill and LGT-rim. In a scene this job did not build, give the
      scene a new World and new light names instead.
  cc/blender-cameras:
    status: active
    summary: Focal length, depth of field, composition, tracking, animated cameras.
  cc/blender-rendering:
    status: active
    summary: Cycles/EEVEE settings, sampling, denoising, colour management, still and animation output.
    notes: >-
      Its GPU recipe changes Blender's Cycles device preferences, which apply to the
      whole machine. Set scene.cycles.device = 'GPU' and leave the preferences alone
      unless the user asks; report any render setting you change in an existing scene.
  cc/blender-animation:
    status: active
    summary: Keyframes, F-curves, easing, shape keys, drivers, NLA.
  cc/blender-export:
    status: active
    summary: glTF/GLB, FBX, OBJ, USD, STL export settings and validation.
    notes: >-
      Its pre-export checklist applies modifiers and transforms and merges vertices on
      the source mesh. On geometry this job did not build, export with
      export_apply=True or work on a duplicate.
  cc/blender-uv-texturing:
    status: active
    summary: UV unwrap, projection, decals, baking, lightmaps, glTF-ready textures.
  cc/animation-quality-gate:
    status: active
    summary: Contact-sheet QA for animation - flicker, framing, silhouette stability.
    requires: {python: true}

  # ----------------------------------------- cc: reference-locked reconstruction
  cc/reference-to-3d:
    status: active
    summary: Entry point for source-locked reconstruction from reference sheets, orthographic views or texture packs.
    requires: {python: true}
    notes: >-
      It chain-loads the cc reconstruction stack by bare name; resolve those
      names inside library/cc. Load cc/blender-skill-harmonizer
      first: it is the hub that sequences the stack.
  cc/wireframe-to-3d:
    status: active
    summary: 2D orthographic wireframe drawings to a 3D model exported as glTF/GLB.
    requires: {python: true}
  cc/reference-look-calibration:
    status: active
    summary: Match materials, light, crop and colour to a supplied reference image with measurable statistics.
    requires: {python: true}
  cc/mascot-logo-reconstruction:
    status: active
    summary: Fail-gated 1:1 reconstruction of mascots, logos and flat brand characters.
  # `via` names the skill that refers to each of these by bare name
  # (checked against the SKILL.md cross-references at the imported commit).
  cc/reference-analysis-validator: {status: chained, via: cc/reference-to-3d, summary: "Source manifests, masks, IoU/SSIM overlay validation.", requires: {python: true}}
  cc/contour-to-mesh:              {status: chained, via: cc/reference-to-3d, summary: "Mesh surfaces built from extracted 2D contours.", requires: {python: true}}
  cc/orthographic-registration:    {status: chained, via: cc/reference-to-3d, summary: "Front/side/back/top views in one coordinate contract.", requires: {python: true}}
  cc/atlas-uv-fitting:             {status: chained, via: cc/reference-to-3d, summary: "Map source parts to atlas regions.", requires: {python: true}}
  cc/multiview-fit-loop:           {status: chained, via: cc/blender-skill-harmonizer, summary: "Render, compare, adjust until all views fit.", requires: {python: true}}
  cc/source-part-segmentation:     {status: chained, via: cc/blender-skill-harmonizer, summary: "Per-part masks from overlapping source art.", requires: {python: true}}
  cc/multiview-constraint-solver:  {status: chained, via: cc/blender-skill-harmonizer, summary: "Decide whether contradictory views can share one rigid model."}
  cc/fit-repair-optimizer:         {status: chained, via: cc/blender-skill-harmonizer, summary: "Turn fit reports into an ordered repair queue."}
  cc/landmark-fit-repair:          {status: chained, via: cc/blender-skill-harmonizer, summary: "Named-landmark validation and repair."}
  cc/texture-driven-mesh-fitting:  {status: chained, via: cc/blender-skill-harmonizer, summary: "Reshape mesh boundaries to texture contours."}
  cc/texture-state-animation:      {status: chained, via: cc/blender-skill-harmonizer, summary: "Registered texture-state transitions without popping.", requires: {python: true}}
  cc/orbital-hud-motion:           {status: chained, via: cc/blender-skill-harmonizer, summary: "Source-derived orbital HUD and aura motion."}
  cc/closed-surface-uv-coverage:   {status: chained, via: cc/blender-uv-texturing, summary: "Front/back/side texture coverage audit for closed assets."}

  # ------------------------------------------------------ cc: knowledge (docs)
  cc/knowledge-compositing:
    status: active
    kind: reference
    path: knowledge/12-compositing/00-overview.md
    summary: Compositor research notes - colour grade, glare, vignette, passes.

  # ------------------------------------------------------------------- gaius
  gaius/blender-arch:
    status: active
    summary: Architecture, furniture, vehicles and products with professional bevel/SubSurf/Boolean technique and a visual loop.
  gaius/blender-coordinator:
    status: active
    summary: Part-by-part build planning - spec sheet analysis, technique per part, dependency order.
  gaius/blender-research:
    status: active
    summary: Decompose a subject into parts and collect real dimensions, colours and materials before modeling.
  gaius/blender-procedural:
    status: active
    summary: Parallel transport, lofted profiles, generalized cylinders, helices, differential growth.
  gaius/blender-geonodes:
    status: active
    summary: Geometry Nodes trees via Python - scatter, curve-to-mesh, noise deformation, parametric inputs.
    notes: With the newo-ether MCP active, build and edit node trees through its structured node tools and use this skill for the graph design.
  gaius/blender-sculpt:
    status: active
    summary: Procedural sculpting - KDTree brushes, falloffs, voxel/quad remesh, multires, displacement.
  gaius/blender-space:
    status: active
    summary: Coordinate systems, transform math, bounding boxes, placement and spatial debugging.
  gaius/blender-rig:
    status: active
    summary: Armatures, FK/IK, algorithmic weights, shape-key drivers, socket system.
  gaius/blender-physics:
    status: active
    summary: Rigid body, soft body, cloth, force fields, particles, bake workflow.
  gaius/blender-texture:
    status: active
    summary: Procedural Principled materials, UV unwrap, AO/normal/diffuse baking, texture painting.
  gaius/blender-lighting:
    status: active
    summary: Deep lighting reference (portrait patterns, product setups); has no frontmatter description.

  # ---------------------------------------------------------------------- kb
  # Not under an open license: see library/kb/LICENSE and registry/libraries.yaml.
  kb/turntable:
    status: active
    summary: 360-degree product orbit.
    requires: {bins: [ffmpeg]}
    notes: &kb_camera >-
      Its renders go to ~/Desktop/Blender Videos: use the job folder instead. It
      sets the scene's frame range, fps, render size and active camera: report
      that. In a scene that is already lit, skip its lighting step and leave the
      World's background alone. Render the frame range only after a still and a
      sparse contact sheet were approved.
  kb/perfect-loop:      {status: active, summary: "Seamless 360 loop whose first and last frames match.", requires: {bins: [ffmpeg]}, notes: *kb_camera}
  kb/slow-zoom:         {status: active, summary: "Slow push-in toward a hero detail.", requires: {bins: [ffmpeg]}, notes: *kb_camera}
  kb/dolly-rotate:      {status: active, summary: "Forward dolly combined with rotation around the subject.", requires: {bins: [ffmpeg]}, notes: *kb_camera}
  kb/crane-shot:        {status: active, summary: "Low-to-high rising reveal.", requires: {bins: [ffmpeg]}, notes: *kb_camera}
  kb/dynamic-full-loop: {status: active, summary: "Speed-ramped loop showing every side including top and bottom.", requires: {bins: [ffmpeg]}, notes: *kb_camera}
  kb/polyhaven-studio-setup:
    status: active
    summary: HDRI-lit product studio with optional PBR ground; curated studio HDRI list.
  kb/polyhaven-scene-builder:
    status: active
    summary: Product scene from Poly Haven HDRI, textured ground or pedestal, optional props.
  kb/polyhaven-texture-apply:
    status: active
    summary: Apply a Poly Haven PBR texture set to an object.
  kb/polyhaven-material-swap:
    status: active
    summary: Render one product across several Poly Haven materials, then restore the scene.
  kb/polyhaven-hdri-showcase:
    status: active
    summary: Render one product across several HDRIs, then give the scene its World back.
  kb/product-polish:
    status: active
    summary: Import a GLB/GLTF and apply a glossy product finish with studio lighting, to the imported model only.
  kb/threejs-export:
    status: active
    summary: Export GLB plus a Three.js viewer page written from a fixed template.
  kb/image-to-3d:
    status: active
    summary: One photo to a textured 3D model through the Meshy API, imported into Blender.
    requires: {env: [MESHY_API_KEY]}
    notes: &kb_meshy >-
      Paid third-party service, and the user's photos are uploaded to it. Use it
      only when the user asked for generation and MESHY_API_KEY is already set in
      their environment; say which images will leave the machine before you
      start. The key is read by the shell from the environment: never ask for
      it, print it, or write it anywhere.
  kb/multi-image-to-3d:
    status: active
    summary: One to four photos to a higher-accuracy 3D model through the Meshy API.
    requires: {env: [MESHY_API_KEY]}
    notes: *kb_meshy

  # ---------------------------------------------------------------------- jo
  jo/blender:
    status: active
    summary: Parametric design workflow - analyze reference, build simple, verify from several angles, iterate; surface pattern library.
    notes: >-
      Its milestone saves and restores are void here. save_as_mainfile turns the
      milestone into the open document, and open_mainfile throws away everything
      unsaved and ends the MCP instance claim. Do not call either, and do not clear
      the scene or start a new file as its workflow suggests: build in a new
      collection and delete only objects this job created, never by name prefix.
