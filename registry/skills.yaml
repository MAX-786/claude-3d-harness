  kb/image-to-3d:
    status: active
    summary: One photo to a textured 3D model through the Meshy API, imported into Blender.
    requires: {env: [MESHY_API_KEY]}
    notes: Paid third-party service. Use only when the user asked for it and MESHY_API_KEY is already set in their environment.
  kb/multi-image-to-3d:
    status: active
    summary: One to four photos to a higher-accuracy 3D model through the Meshy API.
    requires: {env: [MESHY_API_KEY]}
    notes: Paid third-party service. Use only when the user asked for it and MESHY_API_KEY is already set in their environment.
  kb/blender-toolkit:
    status: excluded
    summary: Copy of Dev-GOM blender-toolkit (WebSocket addon, Mixamo retargeting).
    reason: Needs its own Blender addon and WebSocket bridge, which would be a second execution layer next to the single MCP server.

  # ---------------------------------------------------------------------- jo
  jo/blender:
    status: active
    summary: Parametric design workflow - analyze reference, build simple, verify from several angles, iterate; surface pattern library.
