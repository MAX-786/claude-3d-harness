name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0; this action publishes no moving major tag

      - name: Set up (without Blender)
        run: uv run scripts/harness.py setup --skip-blender-extension

      - name: The registry verifies with no warnings, and the library matches its checksums
        run: uv run scripts/harness.py verify --strict

      - name: The checksum list is readable without this project's code
        if: runner.os == 'Linux' # sha256sum is not on every macOS image; one OS proves the point
        run: cd library && sha256sum -c --quiet SHA256SUMS

      - name: The command line prints a load plan and the catalog
        run: |
          uv run scripts/harness.py resolve -w cinematic -p cinematic
          uv run scripts/harness.py list skills

      - name: Tests
        run: uv run --with pytest --with pyyaml pytest -q

  extension:
    # Installs the pinned extension into the oldest Blender the harness supports, headless.
    name: extension install (Blender ${{ matrix.blender }}, Linux)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        blender: ["4.2.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0; this action publishes no moving major tag

      - name: Libraries Blender links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libsm6 libxkbcommon0

      - uses: actions/cache@v6
        id: blender
        with:
          path: ~/blender-${{ matrix.blender }}
          key: blender-${{ matrix.blender }}-linux-x64

      - name: Download Blender
        if: steps.blender.outputs.cache-hit != 'true'
        run: |
          v=${{ matrix.blender }}
          curl -fsSL --retry 3 -o blender.tar.xz "https://download.blender.org/release/Blender${v%.*}/blender-$v-linux-x64.tar.xz"
          mkdir -p "$HOME/blender-$v"
          tar -xf blender.tar.xz --strip-components=1 -C "$HOME/blender-$v"
          rm blender.tar.xz

      - name: Set up, installing the extension into that Blender
        run: uv run scripts/harness.py setup --blender "$HOME/blender-${{ matrix.blender }}/blender"

      - name: doctor finds that Blender and sees the extension
        run: |
          uv run scripts/harness.py doctor | tee doctor.txt
          grep -q "extension 'blender_mcp': installed" doctor.txt
