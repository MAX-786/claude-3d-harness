name: mcp-watch

# Once a week, compare the pinned MCP server release in registry/mcp.yaml with
# the latest one and keep one issue up to date. It never moves the pin: the
# server and its Blender extension run code on the user's machine, so every
# move is reviewed by a person (README, "Pinning and updates"). The skill
# library is not watched: it lives in this repository.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0; this action publishes no moving major tag

      - name: Compare the MCP server pins with the latest release
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          uv run scripts/harness.py outdated --markdown > report.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat report.md

      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "MCP watch: the pinned server is behind"
          CODE: ${{ steps.check.outputs.code }}
        run: |
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          case "$CODE" in
            3)
              if [ -z "$number" ]; then
                gh issue create --title "$TITLE" --body-file report.md
              elif [ "$(gh issue view "$number" --json body --jq .body)" != "$(cat report.md)" ]; then
                gh issue edit "$number" --body-file report.md
                gh issue comment "$number" --body "The report above changed: another pin moved."
              fi
              ;;
            0)
              if [ -n "$number" ]; then
                gh issue close "$number" --comment "The pinned server matches the latest release again."
              fi
              ;;
            *)
              echo "::error::harness.py outdated could not check the MCP server releases (exit $CODE)"
              exit 1
              ;;
          esac
